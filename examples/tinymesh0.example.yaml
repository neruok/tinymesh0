hostname: mynode
listen-port: 51820
# Local path for development. For production use /etc/tinymesh0/private.key.
key-file: ./tinymesh0.key

stun-servers:
  - stun.l.google.com:19302
  - stun.cloudflare.com:3478

# advertise-endpoint overrides STUN and sets the endpoint this node broadcasts
# to peers via gossip. Leave unset on the public internet — STUN will discover
# your public IP automatically. Set it when STUN gives the wrong answer:
#
#   Docker / LAN:      "node-a:51820"    (Docker DNS resolves to bridge IP)
#   Known public IP:   "203.0.113.5:51820"
#   Behind a LB/proxy: "vpn.example.com:51820"
#
# advertise-endpoint: ""

gossip:
  # Required: the same base64-encoded random 32-byte key on every member.
  # The file must be accessible only to its owner (mode 0600 or 0400).
  key-file: /etc/tinymesh0/gossip.key
  bind-port: 7946
  retry-join: 10
  # Leave bootstrap-peers empty if this is the seed (first) node in the cluster.
  # All other nodes need at least one known peer address to bootstrap from.
  bootstrap-peers:
    # - "seed-node.example.com:7946"

# policy controls which mesh traffic this node accepts on the tinymesh0 interface.
# Rules are evaluated in order; the first match wins. src and dst may be a
# hostname (resolved via gossip), a mesh IP, or "*" (any). Specifying a port
# matches both TCP and UDP.
#
# If no rules are configured the policy block is omitted and all traffic is
# allowed (equivalent to default: allow with no rules).
#
# policy:
#   default: allow   # action when no rule matches: "allow" (default) or "deny"
#   rules:
#     - allow: "node-a -> * port 80"        # node-a may reach any peer on port 80
#     - allow: "node-b -> mynode port 5432" # node-b may reach postgres on this node
#     - deny:  "* -> * port 22"             # block SSH from all mesh peers
#     - allow: "* -> *"                     # allow everything else
